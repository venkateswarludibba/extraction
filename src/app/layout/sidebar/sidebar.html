@if(layout.mobileOpen()){
<div class="backdrop" (click)="layout.closeMobile()"></div>
}

<aside class="sidebar">
    <nav>
        <h1 >Angular<span> ☰</span></h1>
        @for(item of menu; track item.link)
        {
        <a [routerlink]="item.link" [routerlinkactive]="active" (click)="layout.closeMobile()" [title]="item.label">
            <span class="icon">{{ item.icon }}</span>
            <span class="label">{{ item.label }}</span>

        </a>
        }
    </nav>

</aside>
